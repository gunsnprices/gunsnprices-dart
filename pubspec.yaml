name: gunsnprices
description: >-
  Parse gun and ammo product titles: brand, model, caliber, magazine capacity,
  barrel length, rounds per box and cost per round. Pure Dart, no dependencies.
version: 0.1.0
homepage: https://gunsnprices.com
repository: https://github.com/gunsnprices/gunsnprices-dart
issue_tracker: https://github.com/gunsnprices/gunsnprices-dart/issues

topics:
  - parser
  - ecommerce
  - firearms
  - ammunition
  - nlp

environment:
  sdk: ^3.5.0

executables:
  gunsnprices: gunsnprices

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
