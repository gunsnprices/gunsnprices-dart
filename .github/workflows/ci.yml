name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.5", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
        if: matrix.sdk == 'stable'
      - run: dart test
      # the same tests compiled to JavaScript (Flutter web, browsers)
      - run: dart test -p chrome test/platform_test.dart
      - run: dart run tool/generate_data.dart && dart format lib && git diff --exit-code lib/src/data
        if: matrix.sdk == 'stable'
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'
